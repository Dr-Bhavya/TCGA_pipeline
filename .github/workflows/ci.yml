name: End-to-End Pipeline Engine

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/docker_tcga_env

jobs:
  # ==========================================================================
  # JOB 1: BUILD + PUSH IMAGE (Runs on GitHub's hosted runner — plenty of RAM)
  # ==========================================================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_latest: ${{ steps.meta.outputs.latest }}
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GH_PAT }}

    - name: Set image tags
      id: meta
      run: |
        # Docker/GHCR requires lowercase image names
        BASE=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
        echo "tag=${BASE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
        echo "latest=${BASE}:latest" >> "$GITHUB_OUTPUT"

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: |
          ${{ steps.meta.outputs.tag }}
          ${{ steps.meta.outputs.latest }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ==========================================================================
  # JOB 2: PULL + RUN ON EC2 (Runs directly on your free-tier instance)
  # ==========================================================================
  run-on-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v5

    - name: Pull Image and Run Pipeline on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.TCGA_AWS_EC2_PUBLIC_IP }}
        username: ubuntu
        key: ${{ secrets.TCGA_AWS_EC2_ACCESS_KEY }}
        port: 22
        timeout: 20m
        script: |
          echo "=== SYSTEM CHECK ==="
          sudo apt-get update -y
          sudo apt-get install -y docker.io curl
          sudo usermod -aG docker ubuntu

          echo "=== CLONE / UPDATE REPO ==="
          cd /home/ubuntu
          if [ -d "TCGA_pipeline" ]; then
            cd TCGA_pipeline && git pull
          else
            git clone https://github.com/${{ github.repository }}.git TCGA_pipeline
            cd TCGA_pipeline
          fi

          echo "=== INSTALL NEXTFLOW (if not already present) ==="
          if ! command -v nextflow &> /dev/null; then
            wget -qO- https://get.nextflow.io | bash
            sudo mv nextflow /usr/local/bin/
          fi
          nextflow -version

          echo "=== LOG IN TO GHCR AND PULL IMAGE ==="
          echo "${{ secrets.GH_PAT }}" | sg docker -c "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          sg docker -c "docker pull ${{ needs.build-and-push.outputs.image_latest }}"

          echo "=== RUN PIPELINE ==="
          sg docker -c "nextflow run main.nf -profile test -stub-run"
