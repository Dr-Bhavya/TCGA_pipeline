name: End-to-End Pipeline Engine

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-on-ec2:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v5

    - name: Run Everything on EC2 over SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.TCGA_AWS_EC2_PUBLIC_IP }}
        username: ubuntu
        key: ${{ secrets.TCGA_AWS_EC2_ACCESS_KEY }}
        port: 22
        timeout: 20m
        script: |
          echo "=== SYSTEM SETUP ==="
          sudo apt-get update -y
          sudo apt-get install -y curl unzip wget apt-transport-https gnupg docker.io git
          sudo usermod -aG docker ubuntu

          echo "=== CLONE / UPDATE REPO ==="
          cd /home/ubuntu
          if [ -d "TCGA_pipeline" ]; then
            cd TCGA_pipeline && git pull
          else
            git clone https://github.com/${{ github.repository }}.git TCGA_pipeline
            cd TCGA_pipeline
          fi

          echo "=== INSTALL JAVA + NEXTFLOW ==="
          sudo mkdir -p /etc/apt/keyrings
          wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/adoptium.gpg > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb $(awk -F= '/^VERSION_CODENAME/{print $2}' /etc/os-release) main" \
            | sudo tee /etc/apt/sources.list.d/adoptium.list
          sudo apt-get update -y
          sudo apt-get install -y temurin-21-jdk
          wget -qO- https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

          echo "=== BUILD DOCKER IMAGE ==="
          sg docker -c "docker build -t docker_tcga_env:latest ."

          echo "=== RUN PIPELINE ==="
          sg docker -c "nextflow run main.nf -profile test -stub-run"
