name: End-to-End Pipeline Engine

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================================================
  # JOB 1: REMOTE EC2 PROVISIONING (Runs on GitHub Cloud Servers)
  # ==========================================================================
  setup-ec2-environment:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Execute Remote Setup over SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.TCGA_AWS_EC2_PUBLIC_IP }}
        username: ubuntu
        key: ${{ secrets.TCGA_AWS_EC2_ACCESS_KEY }}
        port: 22
        timeout: 10m
        script: |
          echo "=== 1. PREPARING CORE SYSTEM ==="
          sudo apt-get update -y
          sudo apt-get install -y curl unzip wget apt-transport-https gnupg docker.io

          echo "=== 2. OVERRIDING DOCKER SOCKET PERMISSIONS ==="
          sudo usermod -aG docker ubuntu
          sudo chmod 666 /var/run/docker.sock

          echo "=== 3. INITIALIZING GITHUB RUNNER AGENT ==="
          cd /home/ubuntu
          if [ ! -d "actions-runner" ]; then
            mkdir actions-runner && cd actions-runner
            # FIXED: Corrected download endpoint link targeting GitHub Releases
            curl -o actions-runner-linux-x64-3.220.0.tar.gz -L https://github.com
            tar xzf ./actions-runner-linux-x64-3.220.0.tar.gz
            
            # FIXED: Corrected api endpoint using ://github.com and valid token expression context syntax
            REG_TOKEN=$(curl -sX POST -H "Authorization: token ${{ secrets.GH_PAT }}" \
              "https://://github.com${{ github.repository }}/actions/runners/registration-token" | grep -o '"token": "[^"]*' | grep -o '[^"]*$')
            
            # FIXED: Fixed repo target url format context syntax string
            ./config.sh --unattended \
              --url "https://github.com{{ github.repository }}" \
              --token "${REG_TOKEN}" \
              --name "tcga_pipeline_nextflow" \
              --replace
              
            sudo ./svc.sh install
            sudo ./svc.sh start
          else
            echo "Runner directory exists. Ensuring system daemon service is actively running..."
            cd actions-runner
            sudo ./svc.sh start || true
          fi

  # ==========================================================================
  # JOB 2: PIPELINE INTEGRATION CHECK (Runs Directly on your Free EC2 Machine)
  # ==========================================================================
  run-nextflow-test:
    runs-on: self-hosted               
    needs: setup-ec2-environment        

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # 1. CLEAN AUTOMATED SYSTEM DEPENDENCY INSTALLATION
    - name: Install Latest Java and Nextflow Engine Natively
      run: |
        echo "=== 1. INSTALLING NATIVE LATEST ECLIPSE TEMURIN JAVA ==="
        sudo mkdir -p /etc/apt/keyrings
        # FIXED: Pulled standard armor keyring target distribution to prevent modern deprecation warning flags
        wget -qO - https://adoptium.net | sudo tee /etc/apt/keyrings/adoptium.gpg > /dev/null
        echo "deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://adoptium.net $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/adoptium.list
        sudo apt-get update -y
        sudo apt-get install -y temurin-21-jdk

        echo "=== 2. WGET AND INSTALL NEXTFLOW NATIVELY ==="
        wget -qO- https://get.nextflow.io | bash
        sudo mv nextflow /usr/local/bin/
        nextflow -version

    # 2. LOW-MEMORY DOCKER BUILD FOR FREE TIER INSTANCES
    - name: Build Local Environment Image
      run: |
        echo "=== 3. BUILDING DOCKER IMAGE WITH COMPACT FOOTPRINT ==="
        docker build --no-cache -t docker_tcga_env:latest .
        docker image ls

    # 3. RUN THE WORKFLOW
    - name: Execute End-to-End Integration Test
      run: |
        nextflow run main.nf -profile test -stub-run
