name: End-to-End Pipeline Engine

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docker/**'
      - 'main.nf'
      - 'nextflow.config'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'docker/**'
      - 'main.nf'
      - 'nextflow.config'
      - '.github/workflows/ci.yml'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/docker_tcga_env

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GH_PAT }}

    - name: Set image tags
      id: meta
      run: |
        BASE=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
        echo "tag=${BASE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
        echo "latest=${BASE}:latest" >> "$GITHUB_OUTPUT"

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        push: true
        load: true
        tags: |
          ${{ steps.meta.outputs.tag }}
          ${{ steps.meta.outputs.latest }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Debug OIDC Token
      uses: actions/github-script@v7
      with:
        script: |
          const token = await core.getIDToken('sts.amazonaws.com');
          const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
          console.log('aud:', payload.aud);
          console.log('sub:', payload.sub);
          console.log('iss:', payload.iss);
          
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::640053197293:role/EC2-S3-Bioinformatics-Role
        aws-region: ap-south-1

    - name: Install Nextflow
      run: |
        wget -qO- https://get.nextflow.io | bash
        sudo mv nextflow /usr/local/bin/
        nextflow -version

    - name: Check disk space
      run: df -h
      
    - name: Run Pipeline
      run: nextflow run main.nf -profile test
      
    - name: Show Nextflow log on failure
      if: always()
      run: |
        if [ -f .nextflow.log ]; then
          tail -150 .nextflow.log
        else
          echo "No .nextflow.log found"
        fi
        
    - name: Commit and Push Results
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add results/
        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Update pipeline results [skip ci]"
          git push
        fi
